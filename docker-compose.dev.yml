version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mundpost_user
      POSTGRES_PASSWORD: mundpost_pass
      POSTGRES_DB: mundpost_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundpost_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
